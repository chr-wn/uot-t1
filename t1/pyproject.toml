[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uot"
version = "0.1.0"
description = "Units of thought: do LMs have an internal algebra of physical units?"
requires-python = ">=3.10"
dependencies = ["pint", "numpy", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
